name: V2 Native Shell APK

on:
  push:
    branches: [v2-native-phase-0]
    paths:
      - "v2-native/android/**"
      - "v2-native/core/**"
      - ".github/workflows/v2-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          install -d -m 700 v2-native/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > v2-native/android/keystore/self-agent-update.p12
          chmod 600 v2-native/android/keystore/self-agent-update.p12
          {
            printf 'storeFile=keystore/self-agent-update.p12\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'storeType=PKCS12\n'
          } > v2-native/android/keystore/keystore.properties
          chmod 600 v2-native/android/keystore/keystore.properties

      - name: Build signed V2 shell APK
        working-directory: v2-native/android
        run: gradle --no-daemon assembleDebug -PversionCode="$((2000 + GITHUB_RUN_NUMBER))" -PversionName="2.0.0-today.${GITHUB_RUN_NUMBER}"

      - name: Verify stable update signature
        run: python3 android/scripts/verify-update-cert.py v2-native/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: self-agent-v2-shell-apk
          path: v2-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f v2-native/android/keystore/self-agent-update.p12 v2-native/android/keystore/keystore.properties
