name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      web_app_url:
        description: "Optional hosted Self Agent URL"
        required: false
        default: "https://self-agent-life-os.kyriamgarciafalcon.chatgpt.site/"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build on-device web UI
        run: |
          cd static-web
          npm install
          npm test
          npm run build
          rm -rf ../android/app/src/main/assets/www
          mkdir -p ../android/app/src/main/assets/www
          cp -a dist/. ../android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build signed APK
        working-directory: android
        env:
          WEB_APP_URL: ${{ inputs.web_app_url || 'https://self-agent-life-os.kyriamgarciafalcon.chatgpt.site/' }}
        run: gradle --no-daemon assembleDebug -PwebAppUrl="$WEB_APP_URL" -PversionCode="$((100 + GITHUB_RUN_NUMBER))" -PversionName="1.1.${GITHUB_RUN_NUMBER}"

      - name: Verify stable update signature
        run: python3 android/scripts/verify-update-cert.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
