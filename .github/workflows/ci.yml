name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install root toolchain
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: |
          pnpm typecheck
          cd static-web && npm ci && npm run typecheck

      - name: Web tests
        run: |
          cd static-web
          npm ci
          npm test

      - name: Web build
        run: |
          cd static-web
          npm run build

      - name: Install Playwright Chromium
        run: |
          cd static-web
          npx playwright install --with-deps chromium

      - name: Browser E2E
        run: |
          cd static-web
          npm run test:e2e

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Android unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest
