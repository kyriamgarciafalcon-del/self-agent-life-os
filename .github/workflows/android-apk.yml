name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "static-web/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: static-web/package-lock.json

      - name: Build on-device web bundle
        working-directory: static-web
        run: |
          npm ci
          npm run build
          mkdir -p ../android/app/src/main/assets/www
          cp -a dist/. ../android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          pathlib.Path("android/app/release.keystore").write_bytes(__import__("base64").b64decode(raw))
          PY

      - name: Build signed debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug \
            -PversionCode="$((1000 + GITHUB_RUN_NUMBER))" \
            -PversionName="1.0.1-home.${GITHUB_RUN_NUMBER}" \
            -PstoreFile="$GITHUB_WORKSPACE/android/app/release.keystore" \
            -PstorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PkeyAlias="$ANDROID_KEY_ALIAS" \
            -PkeyPassword="$ANDROID_KEY_PASSWORD"

      - name: Remove signing material
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
